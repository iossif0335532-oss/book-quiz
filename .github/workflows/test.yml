name: Book Quiz checks
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile bot.py wsgi.py final_recommendation.py book_delivery.py
      - run: python - <<'PY'
import json
from pathlib import Path
json.loads(Path('recommendation_database.json').read_text(encoding='utf-8'))
html = Path('index.html').read_text(encoding='utf-8')
assert 'tg.sendData' in html
assert '/check-access' in html
assert 'quiz_result' in html
print('Book Quiz static checks passed')
PY
