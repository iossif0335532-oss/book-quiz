name: Book Quiz checks

on:
  push:
  pull_request:

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile bot.py wsgi.py
      - run: |
          BOT_TOKEN=test \
          DB_PATH=/tmp/quiz_users.json \
          BOOKS_DB_PATH=/tmp/telegram_books.json \
          EVENTS_PATH=/tmp/telegram_events.json \
          python - <<'PY'
          import json
          from pathlib import Path

          db = json.loads(Path('recommendation_database.json').read_text(encoding='utf-8'))
          assert isinstance(db.get('books'), list)
          assert len(db['books']) == db.get('total_books') == 432
          assert all(x.get('title') and x.get('filename') for x in db['books'])
          assert len({x['book_id'] for x in db['books']}) == 432

          html = Path('index.html').read_text(encoding='utf-8')
          assert 'tg.sendData' in html
          assert "action:'quiz_result'" in html
          assert 'archetype_key' in html
          assert 'mode' in html
          assert html.count("['") >= 12

          import bot
          calls = []
          bot.tg = lambda method, payload=None: calls.append((method, payload)) or {'ok': True, 'result': True}

          channel_update = {
              'update_id': 1,
              'channel_post': {
                  'chat': {'id': -100123, 'title': 'Test Channel'},
                  'message_id': 1,
                  'date': 1,
                  'document': {'file_id': 'TEST_FILE_ID', 'file_name': '1984.pdf', 'mime_type': 'application/pdf'}
              }
          }
          bot.handle_update(channel_update)
          assert len(bot.books()) == 1
          assert bot.books()['1984']['file_id'] == 'TEST_FILE_ID'

          bot.grant_test(777)
          web_update = {
              'update_id': 2,
              'message': {
                  'from': {'id': 777, 'username': 'test'},
                  'chat': {'id': 777},
                  'web_app_data': {'data': json.dumps({'action': 'quiz_result', 'archetype_key': 'VISION', 'archetype': 'Визионер'})}
              }
          }
          bot.handle_update(web_update)
          methods = [method for method, _ in calls]
          assert 'sendMessage' in methods
          assert 'sendDocument' in methods
          print('Book Quiz end-to-end smoke checks passed')
          PY
