name: Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Run Telegram bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          cat > bot.py <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          TOKEN = os.environ["BOT_TOKEN"]
          API = f"https://api.telegram.org/bot{TOKEN}"

          def telegram(method, data=None):
              data = data or {}
              body = urllib.parse.urlencode(data).encode()
              request = urllib.request.Request(
                  f"{API}/{method}",
                  data=body
              )
              with urllib.request.urlopen(request, timeout=35) as response:
                  return json.loads(response.read().decode())

          def send_message(chat_id, text):
              telegram(
                  "sendMessage",
                  {
                      "chat_id": chat_id,
                      "text": text
                  }
              )

          telegram("deleteWebhook")

          # Берём последние ожидающие сообщения
          result = telegram(
              "getUpdates",
              {
                  "offset": -1,
                  "timeout": 5
              }
          )

          updates = result.get("result", [])

          for update in updates:

              message = update.get("message")

              if not message:
                  continue

              chat_id = message["chat"]["id"]

              # Команда /start
              if message.get("text") == "/start":

                  send_message(
                      chat_id,
                      "📚 Привет!\n\n"
                      "Сейчас я определю, какая книга подходит именно тебе.\n\n"
                      "Открой тест и ответь на 12 вопросов."
                  )

              # Результат Mini App
              web_app_data = message.get("web_app_data")

              if web_app_data:

                  try:

                      data = json.loads(
                          web_app_data.get("data", "{}")
                      )

                      if data.get("action") == "quiz_result":

                          archetype = data.get(
                              "archetype",
                              "Не определён"
                          )

                          book = data.get(
                              "book",
                              "Не определена"
                          )

                          match = data.get("match")

                          extras = data.get("extras") or []

                          text = (
                              "🎉 Твой результат готов!\n\n"
                              f"🧠 Типаж: {archetype}\n"
                              f"📕 Твоя книга: {book}\n"
                          )

                          if match:
                              text += f"✨ Совпадение: {match}%\n"

                          if extras:

                              text += "\n📚 Ещё в твою полку:\n"

                              for item in extras:
                                  text += f"• {item}\n"

                          text += (
                              "\n\n"
                              "Хочешь получить свою книгу? "
                              "Напиши мне здесь 📩"
                          )

                          send_message(
                              chat_id,
                              text
                          )

                  except Exception as error:

                      print("Ошибка обработки результата:", error)

          PY

          python bot.py
