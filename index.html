<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Какая книга тебя ждёт?</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--n:#141033;--c:#1f1854;--g:#f6c544;--r:#ff6b6b;--m:#4ad6b0;--l:#c7c0f5;--w:#f6f2e8;--line:#3a3080}*{box-sizing:border-box}body{margin:0;background:radial-gradient(120% 90% at 15% 0%,#2a2170,transparent 55%),var(--n);color:var(--w);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding:20px 18px 40px}.wrap{max-width:600px;margin:auto}.hidden{display:none!important}.k{font-weight:800;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--g);text-align:center}h1,h2,.start,.type-n,.main-book{font-weight:900}h1{text-align:center;font-size:clamp(28px,7vw,42px);line-height:1.05}.sub,.tag{color:var(--l);text-align:center}.start{display:block;width:100%;max-width:340px;margin:20px auto;background:var(--g);color:var(--n);border:0;border-radius:100px;padding:18px;font-size:16px}.fine{text-align:center;color:#7c74b8;font-size:12px}.lock{text-align:center;padding-top:40px}.lock-icon{font-size:72px}.lock p{color:var(--l);max-width:34ch;margin:12px auto 24px}.price{color:var(--g);font-weight:800}.dots{display:flex;gap:6px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--g)}.dots i.now{background:var(--r)}.qn{font-weight:800;font-size:11px;letter-spacing:.2em;color:var(--r);text-transform:uppercase;text-align:center}.q{text-align:center;font-size:clamp(20px,5vw,28px);line-height:1.18}.opts{display:grid;gap:10px}.opt{font-size:16px;text-align:left;color:var(--w);background:var(--c);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;gap:12px;align-items:center;width:100%}.em{font-size:22px}.loading{text-align:center;padding:50px 0}.badge{font-size:68px}.reveal{text-align:center}.type-k,.lab{font-weight:800;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--g)}.type-n{font-size:clamp(28px,7vw,40px);margin:6px 0}.tag{font-size:17px;max-width:32ch;margin:0 auto 24px}.card-book{background:linear-gradient(160deg,#2a2170,var(--c));border:1.5px solid var(--line);border-radius:22px;padding:22px 20px}.main-book{font-size:24px;line-height:1.15;margin:8px 0}.shelf{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}.shelf ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}.cta{background:var(--c);border:1.5px dashed var(--g);border-radius:16px;padding:16px;margin-top:18px;text-align:center}.status{color:var(--m);font-weight:700;text-align:center;margin-top:12px}.error{color:var(--r);text-align:center;margin-top:12px}
</style>
</head>
<body><div class="wrap">
<section id="locked"><div class="lock"><div class="lock-icon">🔒</div><div class="k">Book Quiz</div><h2>Тест пока заблокирован</h2><p id="lockmsg">Проверяем доступ…</p><p class="price">Стоимость — 200 ⭐</p></div></section>
<section id="intro" class="hidden"><div class="k">Библиотерапевт · игра</div><h1>Какая книга<br>тебя ждёт?</h1><p class="sub">12 вопросов не про книги. В конце — твой типаж и книга, которая как будто искала именно тебя.</p><button class="start" id="go">Погнали 🎲</button><p class="fine">Отвечай сердцем, а не головой. Так интереснее.</p></section>
<section id="quiz" class="hidden"><div class="dots" id="dots"></div><div class="qn" id="qn"></div><h2 class="q" id="q"></h2><div class="opts" id="opts"></div></section>
<section id="load" class="hidden"><div class="loading"><div class="badge">🎴</div><p>Готовим твой результат…</p></div></section>
<section id="res" class="hidden"></section>
</div>
<script>
const tg=window.Telegram?.WebApp||null;if(tg){tg.ready();tg.expand()}const API='https://book-quiz.onrender.com';const userId=tg?.initDataUnsafe?.user?.id?String(tg.initDataUnsafe.user.id):null;const TEST_MODE=new URLSearchParams(location.search).get('test')==='1';const $=id=>document.getElementById(id);
const TYPES={LAUNCH:['🚀','Запускатор','Ты не ждёшь идеального момента — ты его создаёшь.',['Сделай. Твой первый шаг','Бизнес с нуля','Мечтать не вредно']],BUILD:['🧱','Архитектор','Другие суетятся — ты выстраиваешь. Хаос тебя бесит.',['Метод тыквы','Управление фирмой','150 драйверов роста прибыли']],CHARM:['🎤','Обаятель','Ты продашь снег зимой — и все останутся довольны.',['Продавай','Никогда не ешьте в одиночку','Влияй']],MOGUL:['👑','Магнат','Деньги для тебя не цель, а способ вести счёт.',['Богатей','Монархия предпринимателя','Форбс']],WRITE:['✍️','Мастер слова','Твоё оружие — текст. Один пост, и все в теме.',['Клад для копирайтера','Бизнес-копирайтинг','Создавай']],VISION:['💡','Визионер','Ты видишь то, что остальные заметят лет через пять.',['Думай иначе. Креативное мышление','Генерация прорывных идей','Alibaba. История мирового восхождения']],BEAST:['🔥','Берсерк','Меньше мыслей — больше дела. Сомнения не про тебя.',['Unfuck yourself','Магический пофигизм','Забей']],BIO:['🧠','Биохакер','Ты понял главное: топливо для успеха — это ты сам.',['Биохакинг мозга','Сила подсознания','Живи']]};
const Q=[['Пятница, 21:00. Где тебя найти?',[['Досиживаю встречу, которая вдруг стала важной','💼',{CHARM:1,MOGUL:1}],['Дома, набрасываю план на выходные','🗒️',{BUILD:2}],['В новом месте, куда вписался в последний момент','🎉',{LAUNCH:1,VISION:1}],['Уже сплю — завтра ранний подъём','😴',{BIO:2}]]],['Тебе дали 3 млн ₸. Потратить надо за сутки. Ты…',[['Вложу в идею, которая давно чешется','💥',{LAUNCH:2}],['Прокачаю себя: курсы, здоровье, книги','🧬',{BIO:1,BUILD:1}],['Устрою движ, о котором будут говорить','🕺',{CHARM:1,VISION:1}],['Прокручу так, чтобы стало десять','📈',{MOGUL:2}]]],['Твоя суперсила в переписке?',[['Уболтаю кого угодно на что угодно','🗣️',{CHARM:2}],['Пишу так, что скринят и пересылают','⚡',{WRITE:2}],['Отвечаю через три дня и не парюсь','🧊',{BEAST:2}],['Задам вопрос, после которого все зависают','🤔',{VISION:2}]]],['Выбери себе питомца по духу:',[['Волк — один, но своё возьмёт','🐺',{MOGUL:1,BEAST:1}],['Пчела — на ней вся система держится','🐝',{BUILD:2}],['Ворон — хитрый и всё подмечает','🐦‍⬛',{VISION:1,CHARM:1}],['Кот — делает что хочет и в ус не дует','🐈',{BEAST:2}]]],['Идеальное утро чемпиона:',[['Кофе — и сразу в бой, задачи ждут','☕',{LAUNCH:1,BUILD:1}],['Зарядка, вода, тишина — тело в приоритете','🧘',{BIO:2}],['Созвоны и движуха с людьми','📞',{CHARM:2}],['Блокнот и новые идеи под музыку','🎧',{VISION:1,WRITE:1}]]],['Что бесит больше всего?',[['Хаос, где никто ни за что не отвечает','🌪️',{BUILD:2}],['Когда ноют вместо того, чтобы делать','🙄',{BEAST:2}],['Когда крутая идея достаётся не тому','😤',{VISION:1,MOGUL:1}],['Скука и предсказуемость','🥱',{LAUNCH:1,WRITE:1}]]],['Твой девиз на футболке:',[['«Сделаю сам»','🛠️',{LAUNCH:2}],['«Дело важнее слов»','🎯',{BUILD:1,BEAST:1}],['«Люди решают всё»','🤝',{CHARM:2}],['«Думай иначе»','🌀',{VISION:2}]]],['Сцена из фильма про тебя:',[['Захожу в переговорную — все замолкают','🕴️',{MOGUL:2}],['Собираю команду с нуля в гараже','🔧',{LAUNCH:1,VISION:1}],['Толкаю речь — зал взрывается','🎙️',{CHARM:2}],['Тренируюсь под дождём, монтаж под бит','🥊',{BEAST:1,BIO:1}]]],['Тебе дарят курс. Какой хватаешь?',[['«Продавать на любые деньги»','💸',{CHARM:1,MOGUL:1}],['«Тексты, что приносят клиентов»','📝',{WRITE:2}],['«Энергия и биохакинг 24/7»','🔋',{BIO:2}],['«Придумывать то, чего ещё нет»','🧪',{VISION:2}]]],['Как ты принимаешь решения?',[['Быстро, по чуйке — потом разберусь','⚡',{BEAST:1,LAUNCH:1}],['Считаю цифры и риски','🧮',{MOGUL:1,BUILD:1}],['Спрошу нужных людей','☎️',{CHARM:2}],['Жду инсайт — он всегда приходит','💫',{VISION:1,BIO:1}]]],['Что для тебя успех?',[['Дело, которое работает без меня','⚙️',{BUILD:2}],['Свобода и деньги на свои правила','🗽',{MOGUL:2}],['Имя, которое знают и уважают','🌟',{CHARM:1,WRITE:1}],['Каждый день быть сильнее вчерашнего','📊',{BIO:1,LAUNCH:1}]]],['И честно — что тормозит тебя сейчас?',[['Слишком много идей, не знаю за что схватиться','🎠',{VISION:1,LAUNCH:1}],['Начинаю и бросаю','🔁',{BEAST:1,BUILD:1}],['Не умею продавать себя','🫥',{CHARM:1,WRITE:1}],['Нет энергии на всё это','🔌',{BIO:2}]]];
let step=0,score=Object.fromEntries(Object.keys(TYPES).map(k=>[k,0]));
function openIntro(){$('locked').classList.add('hidden');$('intro').classList.remove('hidden')}
async function access(){if(!tg||!userId){$('lockmsg').textContent='Открой тест внутри Telegram.';return}if(TEST_MODE){openIntro();return}try{const r=await fetch(API+'/check-access?user_id='+encodeURIComponent(userId));const d=await r.json();if(d.paid)openIntro();else $('lockmsg').textContent='Сначала оплатите прохождение теста в Telegram.'}catch(e){$('lockmsg').textContent='Не удалось проверить доступ. Открой ещё раз.'}}
function render(){const x=Q[step];$('qn').textContent=`Вопрос ${step+1} / ${Q.length}`;$('q').textContent=x[0];$('opts').innerHTML='';x[1].forEach(a=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="em">${a[1]}</span><span>${a[0]}</span>`;b.onclick=()=>{Object.entries(a[2]).forEach(([k,v])=>score[k]+=v);step++;step<Q.length?render():finish()};$('opts').appendChild(b)});[...$('dots').children].forEach((d,i)=>d.className=i<step?'on':i===step?'now':'')}
function start(){step=0;score=Object.fromEntries(Object.keys(TYPES).map(k=>[k,0]));$('intro').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function finish(){$('quiz').classList.add('hidden');$('load').classList.remove('hidden');setTimeout(showResult,500)}
function showResult(){const r=Object.entries(score).sort((a,b)=>b[1]-a[1]),t=TYPES[r[0][0]],total=Object.values(score).reduce((a,b)=>a+b,0),match=Math.min(98,80+Math.round(r[0][1]/Math.max(1,total)*60)),main=t[3][0],extras=t[3].slice(1);$('load').classList.add('hidden');$('res').classList.remove('hidden');$('res').innerHTML=`<div class="reveal"><div class="type-k">Твой типаж</div><div class="badge">${t[0]}</div><div class="type-n">${t[1]}</div><p class="tag">${t[2]}</p></div><div class="card-book"><div class="lab">📕 Твоя книга · совпадение ${match}%</div><div class="main-book">${main}</div><div class="shelf"><div class="lab">Ещё в твою полку</div><ul>${extras.map(x=>`<li>📖 ${x}</li>`).join('')}</ul></div></div><div class="cta">Отправляем результат боту…</div><div id="status" class="status"></div>`;
const payload={action:'quiz_result',archetype:t[1],book:main,match,extras};
if(!tg){$('status').textContent='Открой тест внутри Telegram, чтобы получить книгу.';return}
try{tg.sendData(JSON.stringify(payload));$('status').textContent='✅ Результат отправлен. Бот сейчас пришлёт книгу.';setTimeout(()=>tg.close(),900)}catch(e){console.error(e);$('status').textContent='⚠️ Не удалось отправить результат. Нажми открыть тест заново.'}}
$('go').onclick=start;$('dots').innerHTML=Q.map(()=>'<i></i>').join('');access();
</script></body></html>
