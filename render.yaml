services:
  - type: web
    name: book-quiz
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    disk:
      name: book-quiz-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: RENDER_EXTERNAL_URL
        value: https://book-quiz.onrender.com
      - key: WEB_APP_URL
        value: https://iossif0335532-oss.github.io/book-quiz/
      - key: DB_PATH
        value: /var/data/quiz_users.json
      - key: BOOKS_DB_PATH
        value: /var/data/telegram_books.json
      - key: TEST_MODE
        value: "true"
